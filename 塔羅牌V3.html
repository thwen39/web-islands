<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mystic Tarot - 命運之輪的指引</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+TC:wght@300;400;600&display=swap");

      body {
        font-family: "Noto Serif TC", serif;
        background: radial-gradient(circle at center, #1a0b2e 0%, #05010a 100%);
        color: #e2e8f0;
        overflow-x: hidden;
      }

      h1,
      h2,
      h3,
      .cinzel {
        font-family: "Cinzel", serif;
      }

      /* Mystical glowing accents */
      .gold-text {
        background: linear-gradient(
          to right,
          #bf953f,
          #fcf6ba,
          #b38728,
          #fbf5b7
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 20px rgba(252, 246, 186, 0.2);
      }

      .mystic-shadow {
        box-shadow:
          0 0 30px rgba(179, 135, 40, 0.15),
          inset 0 0 20px rgba(179, 135, 40, 0.05);
      }

      /* 3D Card Flip CSS */
      .scene {
        width: 280px;
        height: 480px;
        perspective: 1200px;
        margin: 0 auto;
      }

      .card {
        width: 100%;
        height: 100%;
        position: relative;
        transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        transform-style: preserve-3d;
        cursor: pointer;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        border-radius: 12px;
      }

      .card.is-flipped {
        transform: rotateY(180deg);
      }

      .card-face {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 12px;
        border: 2px solid #b38728;
        overflow: hidden;
      }

      .card-front {
        background: repeating-linear-gradient(
          45deg,
          #110722,
          #110722 10px,
          #1a0b2e 10px,
          #1a0b2e 20px
        );
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card-front::after {
        content: "";
        position: absolute;
        top: 15px;
        left: 15px;
        right: 15px;
        bottom: 15px;
        border: 1px solid rgba(252, 246, 186, 0.3);
        border-radius: 8px;
        background: radial-gradient(
          circle at center,
          transparent 40%,
          rgba(179, 135, 40, 0.1) 100%
        );
      }

      .card-front-icon {
        font-size: 4rem;
        color: rgba(252, 246, 186, 0.6);
        filter: drop-shadow(0 0 10px rgba(252, 246, 186, 0.3));
      }

      .card-back {
        background-color: #0f081a;
        transform: rotateY(180deg);
        display: flex;
        flex-direction: column;
      }

      .card-image-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
        transition: transform 0.5s ease;
      }

      .card-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.85;
      }

      .card-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 20px 10px;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.9) 0%,
          rgba(0, 0, 0, 0.5) 60%,
          transparent 100%
        );
        z-index: 2;
        text-align: center;
      }

      .is-reversed .card-image-container {
        transform: rotateZ(180deg);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #110722;
      }
      ::-webkit-scrollbar-thumb {
        background: #b38728;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #fcf6ba;
      }

      /* Loader */
      .loader {
        border: 3px solid rgba(179, 135, 40, 0.2);
        border-top: 3px solid #b38728;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        animation: spin 1s linear infinite;
        display: inline-block;
        vertical-align: middle;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .twinkle {
        animation: twinkle 3s infinite alternate;
      }
      @keyframes twinkle {
        0% {
          opacity: 0.5;
        }
        100% {
          opacity: 1;
        }
      }

      select option {
        background-color: #1a0b2e;
        color: #e2e8f0;
      }
    </style>
  </head>
  <body
    class="min-h-screen relative flex flex-col items-center justify-center p-4 sm:p-8"
  >
    <!-- Decorative Stars Background -->
    <div
      class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-30"
    >
      <div
        class="absolute top-10 left-10 w-2 h-2 bg-white rounded-full twinkle"
      ></div>
      <div
        class="absolute top-40 right-20 w-1.5 h-1.5 bg-white rounded-full twinkle"
        style="animation-delay: 1s"
      ></div>
      <div
        class="absolute bottom-20 left-1/4 w-2 h-2 bg-white rounded-full twinkle"
        style="animation-delay: 0.5s"
      ></div>
      <div
        class="absolute top-1/3 right-1/3 w-1 h-1 bg-amber-200 rounded-full twinkle"
        style="animation-delay: 1.5s"
      ></div>
    </div>

    <!-- Main Container -->
    <div
      class="relative z-10 w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-8 items-start"
    >
      <!-- Left Panel: Controls & Result -->
      <div class="lg:col-span-7 flex flex-col gap-6">
        <div
          class="text-center lg:text-left mb-4 flex flex-col sm:flex-row justify-between items-end"
        >
          <div>
            <h1 class="text-4xl sm:text-5xl mb-2 gold-text tracking-wider">
              Mystic Tarot
            </h1>
            <p class="text-amber-200/60 text-lg">
              向宇宙提出你的疑問，讓牌陣揭示未知的指引。
            </p>
          </div>
          <!-- Action Buttons (Settings & History) -->
          <div class="flex gap-4 mt-4 sm:mt-0">
            <button
              onclick="openHistory()"
              class="text-amber-500 hover:text-amber-300 text-sm flex items-center transition-colors"
            >
              <svg
                class="w-5 h-5 mr-1"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                ></path>
              </svg>
              歷史紀錄
            </button>
            <button
              onclick="openSettings()"
              class="text-amber-500 hover:text-amber-300 text-sm flex items-center transition-colors"
            >
              <svg
                class="w-5 h-5 mr-1"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
                ></path>
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                ></path>
              </svg>
              系統設定
            </button>
          </div>
        </div>

        <!-- Input Section -->
        <div
          class="bg-black/40 border border-amber-500/30 p-6 rounded-xl mystic-shadow backdrop-blur-sm"
        >
          <label for="question" class="block text-amber-200 mb-2 font-semibold"
            >你的問題 (你想預測的事項)：</label
          >
          <textarea
            id="question"
            rows="3"
            placeholder="例如：我下個月的工作運勢如何？"
            class="w-full bg-slate-900/80 border border-amber-500/50 rounded-lg p-4 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent resize-none"
          ></textarea>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
            <div>
              <label
                for="manualCard"
                class="block text-amber-200/80 text-sm mb-1"
                >指定牌面 (選填)：</label
              >
              <select
                id="manualCard"
                class="w-full bg-slate-900/80 border border-amber-500/30 rounded-lg p-2.5 text-gray-200 focus:outline-none focus:ring-2 focus:ring-amber-500"
              >
                <option value="random">✨ 隨機抽牌 ✨</option>
              </select>
            </div>
            <div>
              <label
                for="manualOrientation"
                class="block text-amber-200/80 text-sm mb-1"
                >指定正逆位 (選填)：</label
              >
              <select
                id="manualOrientation"
                class="w-full bg-slate-900/80 border border-amber-500/30 rounded-lg p-2.5 text-gray-200 focus:outline-none focus:ring-2 focus:ring-amber-500"
              >
                <option value="random">✨ 隨機決定 ✨</option>
                <option value="upright">正位 (Upright)</option>
                <option value="reversed">逆位 (Reversed)</option>
              </select>
            </div>
          </div>

          <div class="flex justify-end items-center mt-6">
            <button
              id="drawBtn"
              onclick="drawCard()"
              class="bg-gradient-to-r from-amber-600 to-amber-800 hover:from-amber-500 hover:to-amber-700 text-white font-bold py-2 px-8 rounded-lg shadow-lg border border-amber-400 transition-all transform hover:scale-105 active:scale-95"
            >
              送出占卜
            </button>
          </div>
        </div>

        <!-- Reading Result Section -->
        <div
          id="resultContainer"
          class="hidden bg-black/40 border border-amber-500/30 p-6 rounded-xl mystic-shadow backdrop-blur-sm min-h-[250px] flex flex-col"
        >
          <h3
            class="text-xl gold-text mb-4 border-b border-amber-500/30 pb-2 flex justify-between items-center"
          >
            <span>靈性解讀</span>
            <span id="loadingIndicator" class="hidden"
              ><span class="loader mr-2"></span>連結中...</span
            >
          </h3>
          <div
            id="readingContent"
            class="text-gray-300 leading-relaxed space-y-4 whitespace-pre-wrap min-h-[150px] flex-grow"
          >
            <!-- Typed text goes here -->
          </div>
          <!-- 下載按鈕 (打字結束後顯示) -->
          <div
            id="downloadBtnContainer"
            class="hidden mt-6 pt-4 border-t border-amber-500/30 text-right"
          >
            <button
              onclick="downloadCurrentRecord()"
              class="text-sm bg-gray-800 hover:bg-gray-700 border border-amber-500/50 text-amber-200 py-2 px-4 rounded transition-colors flex items-center inline-flex"
            >
              <svg
                class="w-4 h-4 mr-2"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
                ></path>
              </svg>
              下載本次紀錄 (TXT)
            </button>
          </div>
        </div>
      </div>

      <!-- Right Panel: The Card -->
      <div
        class="lg:col-span-5 flex flex-col items-center justify-center pt-8 lg:pt-0"
      >
        <div class="scene">
          <div class="card" id="tarotCard">
            <!-- Back of the card (visible initially) -->
            <div class="card-face card-front">
              <div class="card-front-icon">✧</div>
            </div>
            <!-- Face of the card (visible after flip) -->
            <div class="card-face card-back" id="cardBack">
              <div class="card-image-container" id="cardImageContainer">
                <img
                  id="cardImg"
                  src=""
                  alt="Tarot Card"
                  class="card-image"
                  onerror="
                    this.src =
                      'https://placehold.co/300x500/2a1b38/d4af37?text=Mystic+Tarot'
                  "
                />
              </div>
              <div class="card-overlay">
                <h4
                  id="cardNameDisplay"
                  class="text-xl font-bold gold-text tracking-wide cinzel"
                ></h4>
                <p
                  id="cardPositionDisplay"
                  class="text-sm text-gray-300 mt-1 uppercase tracking-widest"
                ></p>
              </div>
            </div>
          </div>
        </div>
        <p
          class="text-amber-200/50 text-sm mt-8 text-center"
          id="cardInstruction"
        >
          點擊按鈕或深呼吸後點擊牌面
        </p>
      </div>
    </div>

    <!-- Message Box (Alerts) -->
    <div
      id="messageBox"
      class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 hidden backdrop-blur-sm transition-opacity duration-300 opacity-0"
    >
      <div
        class="bg-gray-900 border border-amber-500/50 p-6 rounded-xl shadow-2xl max-w-sm w-full transform scale-95 transition-transform duration-300 mx-4"
      >
        <h3 class="text-xl gold-text mb-3">提示</h3>
        <p id="messageText" class="text-gray-300 mb-6"></p>
        <div class="text-right">
          <button
            onclick="closeMessage()"
            class="bg-amber-700 hover:bg-amber-600 text-white px-6 py-2 rounded-lg transition-colors"
          >
            確認
          </button>
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div
      id="settingsModal"
      class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 hidden backdrop-blur-md transition-opacity duration-300 opacity-0"
    >
      <div
        class="bg-slate-900 border border-amber-500/50 rounded-xl shadow-2xl w-full max-w-2xl max-h-[85vh] flex flex-col transform scale-95 transition-transform duration-300 mx-4"
      >
        <div
          class="p-6 border-b border-amber-500/30 flex justify-between items-center"
        >
          <h2 class="text-2xl gold-text">系統設定</h2>
          <button
            onclick="closeSettings()"
            class="text-gray-400 hover:text-white transition-colors"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>

        <div class="p-6 overflow-y-auto flex-1 custom-scrollbar space-y-6">
          <!-- API Key Section -->
          <div class="bg-black/40 p-4 rounded-lg border border-amber-500/20">
            <h3 class="text-lg gold-text mb-2 flex items-center">
              <svg
                class="w-5 h-5 mr-2"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4v-3.252a1 1 0 01.293-.707l8.198-8.198A6 6 0 0121 9z"
                ></path>
              </svg>
              1. Gemini API 金鑰
            </h3>
            <p class="text-sm text-gray-400 mb-3">
              請輸入您的 Google Gemini API
              Key。金鑰僅會安全地儲存於您的瀏覽器本地端 (LocalStorage)。
            </p>
            <input
              type="password"
              id="apiKeyInput"
              placeholder="在此輸入 API Key (如 AIzaSy...)"
              class="w-full bg-slate-900 border border-gray-700 rounded-md p-2 text-sm text-gray-200 focus:outline-none focus:border-amber-500 transition-colors"
            />
          </div>

          <!-- Custom Cards Section -->
          <div>
            <h3 class="text-lg gold-text mb-2">
              2. 自訂塔羅牌庫 (Major Arcana)
            </h3>
            <p class="text-sm text-gray-400 mb-4">
              在此為 22 張大阿爾克那設定專屬的圖片
              URL。若留空，將使用本地端預設圖片 (塔羅牌/...)。
            </p>
            <div id="settingsList" class="space-y-3">
              <!-- Dynamically populated via JS -->
            </div>
          </div>
        </div>

        <div
          class="p-6 border-t border-amber-500/30 bg-black/20 flex justify-end gap-3"
        >
          <button
            onclick="closeSettings()"
            class="px-5 py-2 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800 transition-colors"
          >
            取消
          </button>
          <button
            onclick="saveSettings()"
            class="bg-amber-700 hover:bg-amber-600 text-white px-6 py-2 rounded-lg shadow-lg transition-colors"
          >
            儲存設定
          </button>
        </div>
      </div>
    </div>

    <!-- History Modal -->
    <div
      id="historyModal"
      class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 hidden backdrop-blur-md transition-opacity duration-300 opacity-0"
    >
      <div
        class="bg-slate-900 border border-amber-500/50 rounded-xl shadow-2xl w-full max-w-3xl max-h-[85vh] flex flex-col transform scale-95 transition-transform duration-300 mx-4"
      >
        <div
          class="p-6 border-b border-amber-500/30 flex justify-between items-center"
        >
          <h2 class="text-2xl gold-text flex items-center">
            <svg
              class="w-6 h-6 mr-2"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
              ></path>
            </svg>
            歷史占卜紀錄
          </h2>
          <button
            onclick="closeHistory()"
            class="text-gray-400 hover:text-white transition-colors"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>

        <div class="p-6 overflow-y-auto flex-1 custom-scrollbar">
          <div id="historyListContainer" class="space-y-6">
            <!-- Dynamically populated via JS -->
            <p class="text-center text-gray-500 py-10">
              尚無占卜紀錄，讓命運之輪開始轉動吧。
            </p>
          </div>
        </div>

        <div
          class="p-6 border-t border-amber-500/30 bg-black/20 flex justify-between gap-3"
        >
          <button
            onclick="clearHistory()"
            class="px-5 py-2 rounded-lg text-red-400 hover:text-red-300 hover:bg-red-900/20 transition-colors"
          >
            清除全部紀錄
          </button>
          <button
            onclick="closeHistory()"
            class="bg-gray-700 hover:bg-gray-600 text-white px-6 py-2 rounded-lg transition-colors"
          >
            關閉
          </button>
        </div>
      </div>
    </div>

    <script>
      // 22 Major Arcana definition
      const majorArcana = [
        {

          defaultUrl: "塔羅牌/00-愚人.jpg",

        {
          id: 1,
          name: "魔術師",
          en: "The Magician",
          defaultUrl: "塔羅牌/01-魔術師.jpg",
        },
        {

          en: "The High Priestess",
          defaultUrl: "塔羅牌/02-女祭師.jpg",
        },

          id: 3,

        },

        },

          defaultUrl: "塔羅牌/15-惡魔.jpg",
        },
        { id: 16, name: "塔", en: "The Tower", defaultUrl: "塔羅牌/16-塔.jpg" },
        {
          id: 17,
          name: "星星",
          en: "The Star",
          defaultUrl: "塔羅牌/17-星星.jpg",
        },
        {
          id: 18,
          name: "月亮",
          en: "The Moon",
          defaultUrl: "塔羅牌/18-月亮.jpg",
        },
        {
          id: 19,
          name: "太陽",
          en: "The Sun",
          defaultUrl: "塔羅牌/19-太陽.jpg",
        },
        {
          id: 20,
          name: "審判",
          en: "Judgement",
          defaultUrl: "塔羅牌/20-審判.jpg",
        },
        {
          id: 21,
          name: "世界",
          en: "The World",
          defaultUrl: "塔羅牌/21-世界.jpg",
        },
      ];

      // Global Variables
      let customImages = {};
      let userApiKey = "";
      let readingHistory = [];
      let currentReadingData = null; // 用來儲存當次占卜以便下載

      // DOM Elements
      const tarotCard = document.getElementById("tarotCard");
      const cardBack = document.getElementById("cardBack");
      const cardImg = document.getElementById("cardImg");
      const cardNameDisplay = document.getElementById("cardNameDisplay");
      const cardPositionDisplay = document.getElementById(
        "cardPositionDisplay",
      );
      const questionInput = document.getElementById("question");
      const manualCardSelect = document.getElementById("manualCard");
      const manualOrientationSelect =
        document.getElementById("manualOrientation");
      const drawBtn = document.getElementById("drawBtn");
      const resultContainer = document.getElementById("resultContainer");
      const readingContent = document.getElementById("readingContent");
      const loadingIndicator = document.getElementById("loadingIndicator");
      const downloadBtnContainer = document.getElementById(
        "downloadBtnContainer",
      );

      const apiKeyInput = document.getElementById("apiKeyInput");
      const messageBox = document.getElementById("messageBox");
      const messageText = document.getElementById("messageText");

      // Init
      function init() {
        // Load Settings (Images & API Key)
        try {
          const savedImages = localStorage.getItem("tarotCustomImages");
          if (savedImages) customImages = JSON.parse(savedImages);

          const savedKey = localStorage.getItem("tarotApiKey");
          if (savedKey) userApiKey = savedKey;

          const savedHistory = localStorage.getItem("tarotHistory");
          if (savedHistory) readingHistory = JSON.parse(savedHistory);
        } catch (e) {
          console.error("Could not load settings", e);
        }

        populateSettings();
        populateManualCardSelect();

        // Card Click Listener
        tarotCard.addEventListener("click", () => {
          if (
            !tarotCard.classList.contains("is-flipped") &&
            questionInput.value.trim() !== ""
          ) {
            drawCard();
          } else if (questionInput.value.trim() === "") {
            showMessage("請先輸入你想預測的問題，讓宇宙感受到你的意圖。");
            questionInput.focus();
          }
        });
      }

      function populateManualCardSelect() {
        majorArcana.forEach((card) => {
          const option = document.createElement("option");
          option.value = card.id;
          option.textContent = `${card.id}. ${card.name} (${card.en})`;
          manualCardSelect.appendChild(option);
        });
      }

      // --- Message Alert System ---
      function showMessage(text) {
        messageText.textContent = text;
        messageBox.classList.remove("hidden");
        void messageBox.offsetWidth;
        messageBox.classList.remove("opacity-0");
        messageBox.querySelector("div").classList.remove("scale-95");
      }

      function closeMessage() {
        messageBox.classList.add("opacity-0");
        messageBox.querySelector("div").classList.add("scale-95");
        setTimeout(() => messageBox.classList.add("hidden"), 300);
      }

      // --- Settings Modal (API Key & Images) ---
      function populateSettings() {
        apiKeyInput.value = userApiKey;
        const settingsList = document.getElementById("settingsList");
        settingsList.innerHTML = "";

        majorArcana.forEach((card) => {
          const val = customImages[card.id] || "";
          const item = document.createElement("div");
          item.className =
            "flex flex-col sm:flex-row sm:items-center gap-3 bg-black/40 p-3 rounded-lg border border-gray-800";
          item.innerHTML = `
            <div class="w-full sm:w-1/3 shrink-0">
                <span class="text-amber-200 font-medium">${card.id}. ${card.name}</span>
                <span class="text-xs text-gray-500 block">${card.en}</span>
            </div>
            <input type="text" id="setting-img-${card.id}" value="${val}" placeholder="圖片 URL (如 https://...)" 
                class="w-full bg-slate-900 border border-gray-700 rounded-md p-2 text-sm text-gray-200 focus:outline-none focus:border-amber-500 transition-colors">
          `;
          settingsList.appendChild(item);
        });
      }

      function openSettings() {
        populateSettings();
        const settingsModal = document.getElementById("settingsModal");
        settingsModal.classList.remove("hidden");
        void settingsModal.offsetWidth;
        settingsModal.classList.remove("opacity-0");
        settingsModal.querySelector("div").classList.remove("scale-95");
      }

      function closeSettings() {
        const settingsModal = document.getElementById("settingsModal");
        settingsModal.classList.add("opacity-0");
        settingsModal.querySelector("div").classList.add("scale-95");
        setTimeout(() => settingsModal.classList.add("hidden"), 300);
      }

      function saveSettings() {
        // Save API Key
        userApiKey = apiKeyInput.value.trim();

        // Save Custom Images
        majorArcana.forEach((card) => {
          const input = document.getElementById(`setting-img-${card.id}`);
          if (input && input.value.trim() !== "") {
            customImages[card.id] = input.value.trim();
          } else {
            delete customImages[card.id];
          }
        });

        try {
          localStorage.setItem("tarotApiKey", userApiKey);
          localStorage.setItem(
            "tarotCustomImages",
            JSON.stringify(customImages),
          );
        } catch (e) {
          console.error("Storage error", e);
        }
        closeSettings();
        showMessage("系統設定已成功儲存！");
      }

      // --- History Modal ---
      function openHistory() {
        const listContainer = document.getElementById("historyListContainer");
        listContainer.innerHTML = "";

        if (readingHistory.length === 0) {
          listContainer.innerHTML = `<p class="text-center text-gray-500 py-10">尚無占卜紀錄，讓命運之輪開始轉動吧。</p>`;
        } else {
          // Display from newest to oldest
          const reversedHistory = [...readingHistory].reverse();
          reversedHistory.forEach((record, index) => {
            const div = document.createElement("div");
            div.className =
              "bg-black/50 border border-gray-700 rounded-lg p-4 relative";
            div.innerHTML = `
                 <div class="flex justify-between items-start mb-2">
                    <span class="text-amber-500 font-bold">${record.card} (${record.orientation})</span>
                    <span class="text-xs text-gray-500">${record.time}</span>
                 </div>
                 <p class="text-sm text-amber-100 mb-3 border-b border-gray-700 pb-2">Q: ${record.question}</p>
                 <div class="text-gray-300 text-sm whitespace-pre-wrap leading-relaxed">${record.result}</div>
              `;
            listContainer.appendChild(div);
          });
        }

        const modal = document.getElementById("historyModal");
        modal.classList.remove("hidden");
        void modal.offsetWidth;
        modal.classList.remove("opacity-0");
        modal.querySelector("div").classList.remove("scale-95");
      }

      function closeHistory() {
        const modal = document.getElementById("historyModal");
        modal.classList.add("opacity-0");
        modal.querySelector("div").classList.add("scale-95");
        setTimeout(() => modal.classList.add("hidden"), 300);
      }

      function clearHistory() {
        if (confirm("確定要清除所有歷史占卜紀錄嗎？此動作無法復原。")) {
          readingHistory = [];
          localStorage.removeItem("tarotHistory");
          openHistory(); // refresh view
        }
      }

      // --- Draw & Gemini Logic ---
      function getCardImage(card) {
        return customImages[card.id] ? customImages[card.id] : card.defaultUrl;
      }

      async function drawCard() {
        if (!userApiKey) {
          showMessage(
            "請先點擊「系統設定」輸入您的 Gemini API 金鑰，才能進行靈性解讀。",
          );
          return;
        }

        const question = questionInput.value.trim();
        if (!question) {
          showMessage("請先輸入你想預測的問題，讓宇宙感受到你的意圖。");
          questionInput.focus();
          return;
        }

        // UI Reset
        drawBtn.disabled = true;
        drawBtn.classList.add("opacity-50", "cursor-not-allowed");
        questionInput.disabled = true;
        manualCardSelect.disabled = true;
        manualOrientationSelect.disabled = true;
        downloadBtnContainer.classList.add("hidden");

        if (tarotCard.classList.contains("is-flipped")) {
          tarotCard.classList.remove("is-flipped");
          await new Promise((r) => setTimeout(r, 600));
        }

        resultContainer.classList.remove("hidden");
        readingContent.innerHTML = "";
        loadingIndicator.classList.remove("hidden");

        // Determination logic
        let drawnCard =
          manualCardSelect.value === "random"
            ? majorArcana[Math.floor(Math.random() * majorArcana.length)]
            : majorArcana.find(
                (c) => c.id === parseInt(manualCardSelect.value),
              );

        let isReversed =
          manualOrientationSelect.value === "random"
            ? Math.random() < 0.5
            : manualOrientationSelect.value === "reversed";

        // Update Card DOM
        cardImg.src = getCardImage(drawnCard);
        cardNameDisplay.textContent = `${drawnCard.name}`;

        if (isReversed) {
          cardBack.classList.add("is-reversed");
          cardPositionDisplay.textContent = "Reversed (逆位)";
          cardPositionDisplay.classList.replace(
            "text-gray-300",
            "text-red-400",
          );
        } else {
          cardBack.classList.remove("is-reversed");
          cardPositionDisplay.textContent = "Upright (正位)";
          cardPositionDisplay.classList.replace(
            "text-red-400",
            "text-gray-300",
          );
        }

        setTimeout(() => tarotCard.classList.add("is-flipped"), 100);

        // Current record template
        const now = new Date();
        const timeString = `${now.getFullYear()}/${(now.getMonth() + 1).toString().padStart(2, "0")}/${now.getDate().toString().padStart(2, "0")} ${now.getHours().toString().padStart(2, "0")}:${now.getMinutes().toString().padStart(2, "0")}`;

        currentReadingData = {
          time: timeString,
          question: question,
          card: drawnCard.name,
          orientation: isReversed ? "逆位" : "正位",
          result: "", // to be filled
        };

        // Call API
        await fetchReadingFromGemini(question, drawnCard, isReversed);

        // Re-enable UI
        drawBtn.disabled = false;
        drawBtn.classList.remove("opacity-50", "cursor-not-allowed");
        questionInput.disabled = false;
        manualCardSelect.disabled = false;
        manualOrientationSelect.disabled = false;
      }

      async function fetchReadingFromGemini(question, card, isReversed) {
        const position = isReversed ? "逆位" : "正位";
        const fullCardName = `${card.name} (${card.en})`;
        const prompt = `使用者想問的問題：${question}。抽到的塔羅牌是：${fullCardName} (${position})。請根據這張牌的牌意與正逆位狀態，為使用者解答他們的問題。`;

        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${userApiKey}`;
        const payload = {
          contents: [{ parts: [{ text: prompt }] }],
          systemInstruction: {
            parts: [
              {
                text: "你是一位充滿靈性、智慧且富有同理心的塔羅占卜師。請使用繁體中文回應。解讀結構：1. 牌義簡述，2. 針對問題的解析，3. 給予建議。回應中請使用適當的段落與 Markdown 粗體 (**詞彙**)。",
              },
            ],
          },
        };

        try {
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const result = await response.json();
          loadingIndicator.classList.add("hidden");

          if (
            response.ok &&
            result.candidates &&
            result.candidates[0].content
          ) {
            const textResponse = result.candidates[0].content.parts[0].text;

            // Save to object & history
            currentReadingData.result = textResponse.replace(/\*\*/g, ""); // Remove markdown for plain txt saving
            readingHistory.push(currentReadingData);
            localStorage.setItem(
              "tarotHistory",
              JSON.stringify(readingHistory),
            );

            await typeWriterEffect(textResponse, readingContent, 25, () => {
              downloadBtnContainer.classList.remove("hidden"); // Show download button after typing ends
            });
          } else {
            const errMsg = result.error ? result.error.message : "未知錯誤";
            readingContent.innerHTML = `<span class="text-red-400">宇宙的訊號微弱，暫時無法解讀 (${errMsg})。請檢查您的 API 金鑰。</span>`;
          }
        } catch (error) {
          loadingIndicator.classList.add("hidden");
          readingContent.innerHTML =
            '<span class="text-red-400">與星界連結中斷，請檢查網路狀態或金鑰是否正確。</span>';
          console.error("API Call Failed:", error);
        }
      }

      // Typewriter Effect (Returns a Promise)
      async function typeWriterEffect(
        text,
        element,
        speed = 25,
        onComplete = null,
      ) {
        element.innerHTML = "";
        const parsedText = text.replace(
          /\*\*(.*?)\*\*/g,
          '<strong class="gold-text">$1</strong>',
        );
        element.innerHTML = parsedText.replace(/\n/g, "<br>");
        const tempDiv = document.createElement("div");
        tempDiv.innerHTML = element.innerHTML;

        const tokens = [];
        let inTag = false,
          currentTag = "";
        const rawHTML = tempDiv.innerHTML;
        for (let i = 0; i < rawHTML.length; i++) {
          const char = rawHTML[i];
          if (char === "<") {
            inTag = true;
            currentTag = char;
          } else if (char === ">") {
            inTag = false;
            currentTag += char;
            tokens.push({ type: "tag", val: currentTag });
            currentTag = "";
          } else if (inTag) {
            currentTag += char;
          } else {
            tokens.push({ type: "char", val: char });
          }
        }

        element.innerHTML = "";
        let currentHTML = "";
        for (let i = 0; i < tokens.length; i++) {
          currentHTML += tokens[i].val;
          element.innerHTML = currentHTML;
          if (tokens[i].type === "char") {
            await new Promise((r) =>
              setTimeout(r, speed + (Math.random() * 15 - 5)),
            );
            const container = document.getElementById("resultContainer");
            if (container)
              window.scrollTo({
                top: container.offsetTop + container.offsetHeight,
                behavior: "smooth",
              });
          }
        }
        if (onComplete) onComplete();
      }

      // --- Download TXT ---
      function downloadCurrentRecord() {
        if (!currentReadingData) return;

        const content =
          `====== 神秘塔羅占卜紀錄 ======\n` +
          `時間：${currentReadingData.time}\n` +
          `問題：${currentReadingData.question}\n` +
          `抽牌：${currentReadingData.card} (${currentReadingData.orientation})\n` +
          `==============================\n\n` +
          `【靈性解讀】\n${currentReadingData.result}\n\n` +
          `==============================\n` +
          `願星辰指引你的道路 ✨`;

        const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `塔羅占卜紀錄_${currentReadingData.time.replace(/[\/:\s]/g, "")}.txt`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

      window.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
