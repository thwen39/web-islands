<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>3D 敲擊地鼠 (Three.js)</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #1a1a1a;
        font-family:
          "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      #webgl-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      #css2d-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 30px;
        box-sizing: border-box;
        z-index: 10;
      }

      .hud-top {
        display: flex;
        justify-content: space-between;
        font-size: 28px;
        color: #fff;
        font-weight: bold;
        text-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
      }

      .hud-box {
        background: rgba(255, 255, 255, 0.1);
        padding: 10px 20px;
        border-radius: 12px;
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      #menu {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: auto;
        background: rgba(255, 255, 255, 0.95);
        padding: 50px 60px;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        z-index: 20;
        transition: opacity 0.3s;
      }

      h1 {
        margin: 0 0 10px 0;
        color: #222;
        font-size: 36px;
      }
      p {
        color: #666;
        margin-bottom: 30px;
        font-size: 18px;
      }
      #final-score {
        color: #ff5722;
        font-size: 28px;
        margin-bottom: 20px;
        font-weight: bold;
        display: none;
      }

      button {
        font-size: 22px;
        padding: 15px 40px;
        cursor: pointer;
        background: linear-gradient(135deg, #ff9800, #ff5722);
        color: #fff;
        border: none;
        border-radius: 12px;
        font-weight: bold;
        font-family: inherit;
        box-shadow: 0 5px 15px rgba(255, 87, 34, 0.4);
        transition: all 0.15s ease;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(255, 87, 34, 0.6);
      }
      button:active {
        transform: translateY(2px);
        box-shadow: 0 2px 5px rgba(255, 87, 34, 0.4);
      }

      /* CSS2D 浮動分數樣式 */
      .floating-score {
        color: #ffeb3b;
        font-size: 32px;
        font-weight: 900;
        text-shadow:
          0 3px 0 #f57f17,
          0 5px 10px rgba(0, 0, 0, 0.5);
        pointer-events: none;
        will-change: transform, opacity;
      }
    </style>
    <!-- Three.js Import Map -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="webgl-container"></div>
    <div id="css2d-container"></div>

    <div id="ui-layer">
      <div class="hud-top">
        <div class="hud-box" id="score-display">分數: 0</div>
        <div class="hud-box" id="time-display">時間: 30.0s</div>
      </div>
    </div>

    <div id="menu">
      <h1>3D 打地鼠</h1>
      <p>越快敲擊分數越高！考驗你的極限反應</p>
      <div id="final-score">最終分數: 0</div>
      <button id="start-btn">開始挑戰</button>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import {
        CSS2DRenderer,
        CSS2DObject,
      } from "three/addons/renderers/CSS2DRenderer.js";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

      // --- 核心系統與狀態 ---
      let scene, camera, renderer, cssRenderer, controls;
      let clock = new THREE.Clock();
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      let score = 0;
      let isPlaying = false;
      const GAME_DURATION = 30; // 遊戲時長
      let gameEndTime = 0;
      let nextSpawnTime = 0;

      // 遊戲物件群組
      const moles = []; // { mesh, state, timer, spawnTime }
      const floatingTexts = []; // CSS2D 分數
      let hammerGroup, hammerPivot;
      const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -1.5);

      // 材質快取
      let matMoleNormal, matMoleHit;

      init();
      animate();

      function init() {
        const container = document.getElementById("webgl-container");
        const cssContainer = document.getElementById("css2d-container");

        // 1. Scene & Camera
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a2a3a);
        scene.fog = new THREE.Fog(0x1a2a3a, 20, 50);

        camera = new THREE.PerspectiveCamera(
          45,
          window.innerWidth / window.innerHeight,
          0.1,
          100,
        );
        camera.position.set(0, 18, 22);

        // 2. Renderers (WebGL & CSS2D)
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        cssRenderer = new CSS2DRenderer();
        cssRenderer.setSize(window.innerWidth, window.innerHeight);
        cssContainer.appendChild(cssRenderer.domElement);

        // 3. Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const spotLight = new THREE.SpotLight(0xfffae6, 2000);
        spotLight.position.set(10, 25, 10);
        spotLight.angle = Math.PI / 4;
        spotLight.penumbra = 0.5;
        spotLight.castShadow = true;
        spotLight.shadow.mapSize.width = 2048;
        spotLight.shadow.mapSize.height = 2048;
        spotLight.shadow.camera.near = 10;
        spotLight.shadow.camera.far = 50;
        scene.add(spotLight);

        // 4. Controls
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enablePan = false;
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2.2; // 限制視角不能鑽到地底
        controls.minDistance = 15;
        controls.maxDistance = 35;

        // 5. 遊戲資產建置 (程式化產生)
        buildMaterials();
        buildBoard();
        buildMoles();
        buildHammer();

        // 6. 事件監聽
        window.addEventListener("resize", onWindowResize);
        window.addEventListener("pointermove", onPointerMove);
        window.addEventListener("pointerdown", onPointerDown);
        document
          .getElementById("start-btn")
          .addEventListener("click", startGame);
      }

      // --- 程式化貼圖產生器 (Canvas API) ---
      function createMoleTexture(isHit = false) {
        const canvas = document.createElement("canvas");
        canvas.width = 512;
        canvas.height = 256;
        const ctx = canvas.getContext("2d");

        // 皮膚底色
        ctx.fillStyle = "#795548";
        ctx.fillRect(0, 0, 512, 256);

        // 嘴管區域
        ctx.fillStyle = "#d7ccc8";
        ctx.beginPath();
        ctx.ellipse(256, 160, 70, 45, 0, 0, Math.PI * 2);
        ctx.fill();

        // 鼻子
        ctx.fillStyle = "#3e2723";
        ctx.beginPath();
        ctx.arc(256, 145, 18, 0, Math.PI * 2);
        ctx.fill();

        // 眼睛
        ctx.lineWidth = 10;
        ctx.lineCap = "round";
        ctx.strokeStyle = "#212121";
        ctx.fillStyle = "#212121";

        if (isHit) {
          // 暈眩眼睛 (X X)
          const drawX = (cx, cy) => {
            ctx.beginPath();
            ctx.moveTo(cx - 15, cy - 15);
            ctx.lineTo(cx + 15, cy + 15);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx + 15, cy - 15);
            ctx.lineTo(cx - 15, cy + 15);
            ctx.stroke();
          };
          drawX(190, 100);
          drawX(322, 100);
        } else {
          // 正常圓眼
          ctx.beginPath();
          ctx.arc(190, 100, 12, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(322, 100, 12, 0, Math.PI * 2);
          ctx.fill();
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
      }

      function buildMaterials() {
        matMoleNormal = new THREE.MeshStandardMaterial({
          map: createMoleTexture(false),
          roughness: 0.8,
          metalness: 0.1,
        });
        matMoleHit = new THREE.MeshStandardMaterial({
          map: createMoleTexture(true),
          roughness: 0.9,
          metalness: 0.0,
        });
      }

      // --- 場景物件建置 ---
      function buildBoard() {
        const boardGroup = new THREE.Group();

        // 主基座 (使用 RoundedBoxGeometry 提升質感)
        const baseGeo = new RoundedBoxGeometry(16, 2, 16, 6, 0.5);
        const baseMat = new THREE.MeshStandardMaterial({
          color: 0x4caf50,
          roughness: 0.9,
        });
        const baseMesh = new THREE.Mesh(baseGeo, baseMat);
        baseMesh.position.y = -1;
        baseMesh.receiveShadow = true;
        boardGroup.add(baseMesh);

        // 土層側邊
        const dirtGeo = new RoundedBoxGeometry(15.5, 3, 15.5, 4, 0.2);
        const dirtMat = new THREE.MeshStandardMaterial({
          color: 0x3e2723,
          roughness: 1.0,
        });
        const dirtMesh = new THREE.Mesh(dirtGeo, dirtMat);
        dirtMesh.position.y = -1.6;
        dirtMesh.receiveShadow = true;
        boardGroup.add(dirtMesh);

        // 畫 4x4 的洞口 (黑色平片)
        const holeGeo = new THREE.CircleGeometry(1.2, 32);
        const holeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });

        for (let i = 0; i < 16; i++) {
          const x = (i % 4) * 3.5 - 5.25;
          const z = Math.floor(i / 4) * 3.5 - 5.25;
          const hole = new THREE.Mesh(holeGeo, holeMat);
          hole.rotation.x = -Math.PI / 2;
          hole.position.set(x, 0.01, z); // 微高於基座避免 Z-fighting
          boardGroup.add(hole);
        }

        scene.add(boardGroup);
      }

      function buildMoles() {
        const moleGeo = new THREE.CylinderGeometry(0.9, 1.0, 2.5, 32);
        // 調整 UV 使臉部貼圖對齊正面
        const uvs = moleGeo.attributes.uv;
        for (let i = 0; i < uvs.count; i++) {
          uvs.setX(i, uvs.getX(i) + 0.25);
        }

        for (let i = 0; i < 16; i++) {
          const mesh = new THREE.Mesh(moleGeo, matMoleNormal);
          mesh.castShadow = true;
          mesh.receiveShadow = true;

          const x = (i % 4) * 3.5 - 5.25;
          const z = Math.floor(i / 4) * 3.5 - 5.25;

          // 預設藏於地底 (-2)
          mesh.position.set(x, -2, z);
          scene.add(mesh);

          moles.push({
            mesh: mesh,
            state: "hidden", // 'hidden', 'rising', 'idle', 'falling', 'hit'
            timer: 0,
            spawnTime: 0,
          });
        }
      }

      function buildHammer() {
        hammerGroup = new THREE.Group();

        // 讓旋轉軸在手把末端
        hammerPivot = new THREE.Group();
        hammerGroup.add(hammerPivot);

        // 把手
        const handleGeo = new THREE.CylinderGeometry(0.2, 0.2, 3.5, 16);
        handleGeo.translate(0, 1.75, 0); // 往上偏移，底端為 (0,0,0)
        const handleMat = new THREE.MeshStandardMaterial({ color: 0x8d6e63 });
        const handle = new THREE.Mesh(handleGeo, handleMat);
        handle.castShadow = true;
        hammerPivot.add(handle);

        // 槌頭 (使用 RoundedBox)
        const headGeo = new RoundedBoxGeometry(2.5, 1.6, 1.6, 4, 0.2);
        const headMat = new THREE.MeshStandardMaterial({
          color: 0xb0bec5,
          metalness: 0.5,
          roughness: 0.4,
        });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.set(0, 3.5, 0); // 裝在把手頂端
        head.rotation.y = Math.PI / 2; // 🌟 加入這行：將槌頭轉 90 度
        head.castShadow = true;
        hammerPivot.add(head);

        // 預設姿態
        hammerPivot.rotation.x = Math.PI / 6;
        hammerGroup.position.set(0, 5, 0);
        scene.add(hammerGroup);
      }

      // --- 互動與控制 ---
      function onPointerMove(event) {
        // 更新游標位置供 Raycaster 使用
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        if (isPlaying) {
          raycaster.setFromCamera(mouse, camera);
          const target = new THREE.Vector3();
          raycaster.ray.intersectPlane(groundPlane, target);

          if (target) {
            // 平滑跟隨滑鼠
            hammerGroup.position.lerp(
              new THREE.Vector3(target.x, 1.5, target.z + 2.5),
              0.3,
            );
          }
        }
      }

      function onPointerDown(event) {
        if (!isPlaying) return;

        // 1. 槌子敲擊動畫 (暴力覆蓋旋轉)
        hammerPivot.rotation.x = -Math.PI / 2.5;

        // 2. 射線檢測打擊
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(moles.map((m) => m.mesh));

        if (intersects.length > 0) {
          const hitMesh = intersects[0].object;
          const moleData = moles.find((m) => m.mesh === hitMesh);

          // 只有處於上升或停留狀態的才能被打
          if (moleData.state === "rising" || moleData.state === "idle") {
            handleHit(moleData);
          }
        }
      }

      function handleHit(moleData) {
        // 換上暈眩材質
        moleData.mesh.material = matMoleHit;
        moleData.state = "hit";
        moleData.timer = 0; // 重置計時器供下沉使用

        // 計算反應時間得分 (Speed Bonus)
        const reactionTimeMs = performance.now() - moleData.spawnTime;
        // < 200ms 得 100分，> 1000ms 得 10分
        let points = 100 - Math.floor((reactionTimeMs - 200) / 8);
        points = Math.max(10, Math.min(100, points)); // 限制在 10 ~ 100 之間

        score += points;
        document.getElementById("score-display").innerText = `分數: ${score}`;

        // 產生 3D 浮動分數特效 (CSS2D)
        spawnFloatingScore(points, moleData.mesh.position);
      }

      function spawnFloatingScore(points, position) {
        const div = document.createElement("div");
        div.className = "floating-score";
        div.textContent = `+${points}`;

        const cssObj = new CSS2DObject(div);
        cssObj.position.copy(position);
        cssObj.position.y += 1.5; // 在頭頂出現
        scene.add(cssObj);

        floatingTexts.push({
          object: cssObj,
          element: div,
          life: 1.0, // 生命週期
        });
      }

      // --- 遊戲邏輯與主迴圈 ---
      function startGame() {
        document.getElementById("menu").style.opacity = "0";
        setTimeout(
          () => (document.getElementById("menu").style.display = "none"),
          300,
        );

        score = 0;
        isPlaying = true;
        gameEndTime = performance.now() + GAME_DURATION * 1000;
        nextSpawnTime = performance.now() + 500;

        document.getElementById("score-display").innerText = `分數: 0`;

        // 重置所有地鼠
        moles.forEach((m) => {
          m.state = "hidden";
          m.mesh.position.y = -2;
          m.mesh.material = matMoleNormal;
        });
      }

      function endGame() {
        isPlaying = false;
        const menu = document.getElementById("menu");
        menu.style.display = "block";
        setTimeout(() => (menu.style.opacity = "1"), 50);

        const finalScoreEl = document.getElementById("final-score");
        finalScoreEl.style.display = "block";
        finalScoreEl.innerText = `最終分數: ${score}`;
        document.getElementById("start-btn").innerText = "再玩一次";

        // 把所有地鼠縮回去
        moles.forEach((m) => (m.state = "falling"));
      }

      function updateMoles(delta) {
        const speed = 12; // 上下移動速度
        const upY = 1.0;
        const downY = -2.0;

        // 隨機生成邏輯
        if (isPlaying && performance.now() > nextSpawnTime) {
          const hiddens = moles.filter((m) => m.state === "hidden");
          if (hiddens.length > 0) {
            const randomMole =
              hiddens[Math.floor(Math.random() * hiddens.length)];
            randomMole.state = "rising";
            randomMole.spawnTime = performance.now();
            randomMole.mesh.material = matMoleNormal;
          }
          // 隨著時間減少，生成間隔變短 (難度提升)
          const timeLeftR =
            (gameEndTime - performance.now()) / (GAME_DURATION * 1000);
          const spawnInterval = 300 + timeLeftR * 600; // 300ms ~ 900ms
          nextSpawnTime = performance.now() + spawnInterval;
        }

        // 狀態機更新
        moles.forEach((m) => {
          if (m.state === "rising") {
            m.mesh.position.y += speed * delta;
            if (m.mesh.position.y >= upY) {
              m.mesh.position.y = upY;
              m.state = "idle";
              m.timer = 0;
            }
          } else if (m.state === "idle") {
            m.timer += delta;
            // 停留時間
            if (m.timer > 0.8) {
              m.state = "falling";
            }
          } else if (m.state === "falling") {
            m.mesh.position.y -= speed * delta;
            if (m.mesh.position.y <= downY) {
              m.mesh.position.y = downY;
              m.state = "hidden";
            }
          } else if (m.state === "hit") {
            // 被打到快速下沉
            m.mesh.position.y -= speed * 1.5 * delta;
            if (m.mesh.position.y <= downY) {
              m.mesh.position.y = downY;
              m.state = "hidden";
            }
          }
        });
      }

      function updateFloatingTexts(delta) {
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
          const ft = floatingTexts[i];
          ft.life -= delta * 1.2; // 消失速度

          // 往上飄
          ft.object.position.y += delta * 2;
          ft.element.style.opacity = Math.max(0, ft.life);
          ft.element.style.transform = `scale(${0.5 + ft.life * 0.5})`;

          if (ft.life <= 0) {
            scene.remove(ft.object);
            floatingTexts.splice(i, 1);
          }
        }
      }

      function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();

        controls.update();

        // 槌子物理回彈 (lerp back to default rotation)
        if (hammerPivot) {
          hammerPivot.rotation.x +=
            (Math.PI / 6 - hammerPivot.rotation.x) * 0.2;
        }

        if (isPlaying) {
          const timeLeft = Math.max(
            0,
            (gameEndTime - performance.now()) / 1000,
          );
          document.getElementById("time-display").innerText =
            `時間: ${timeLeft.toFixed(1)}s`;

          if (timeLeft === 0) {
            endGame();
          }
        }

        updateMoles(delta);
        updateFloatingTexts(delta);

        renderer.render(scene, camera);
        cssRenderer.render(scene, camera);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        cssRenderer.setSize(window.innerWidth, window.innerHeight);
      }
    </script>
  </body>
</html>
